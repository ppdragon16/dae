name: Lint

on:
  pull_request:
    paths:
      - "**/*.c"
      - "**/*.h"
      - ".github/workflows/lint.yml"

jobs:

  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Perl
      uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7  # v1
      with:
        perl-version: "5.38"

    - name: Run lint
      run: make ebpf-lint
