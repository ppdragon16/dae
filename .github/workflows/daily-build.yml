name: Daily Build (Main)

on:
  # Manual runs: the cron below can be delayed for hours (or skipped), so allow
  # starting one on demand from the Actions page.
  workflow_dispatch:
  schedule:
    # At (UTC+8 0:00 | UTC+0 16:00) every day
    - cron: "0 16 * * *"

jobs:
  pre-actions:
    uses: daeuniverse/ci-seed-jobs/.github/workflows/pre-actions.yml@master
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      fetch-depth: 0
      check-runs: '["build", "daily-build-passed"]'
    secrets: inherit

  build:
    # Built by this repo's own copy: upstream's seed-build.yml@main now needs
    # the CI scripts and Makefile targets of upstream #1099, which this fork
    # does not carry. The local copy is self-contained (no scripts).
    uses: ./.github/workflows/seed-build.yml
    with:
      ref: ${{ github.sha }}
      build-type: daily-build

  post-actions:
    if: always()
    needs: [build]
    uses: daeuniverse/ci-seed-jobs/.github/workflows/dae-post-actions.yml@master
    with:
      check-run-id: "dae-bot[bot]/daily-build-passed"
      check-run-conclusion: ${{ needs.build.result }}
    secrets: inherit
