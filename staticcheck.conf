# The bug checks (SA), simplicity checks (S) and unused checks (U) gate the
# codebase. The ST style family stays off: its naming rules (error vars named
# ErrFoo, error as the last result) would force renames of symbols shared with
# upstream dae, which hurts merge-ability for no behavioural gain.
checks = ["all", "-ST*", "-SA6002"]
# SA6002 (sync.Pool.Put of a slice header) is excluded deliberately: the idiom
# dialerSlicePool/bitmapPool use allocates one 24-byte header per Put, and
# wrapping every pool in *[]T would churn the dialer-selection and domain-
# matcher hot paths for that.
